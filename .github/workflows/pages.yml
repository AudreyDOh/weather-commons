name: pages
# Builds the published sketches (see PUBLISHED in scripts/build-pages.mjs) and deploys
# them to GitHub Pages: https://realtimeurbanismlab.github.io/weather-commons/
on:
  push:
    branches: [main]
    paths: [sketches/**, scripts/build-pages.mjs, scripts/index-sketches.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build-pages.mjs --base /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
